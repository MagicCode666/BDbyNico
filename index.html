<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gérez votre collection de bandes dessinées." />
    <meta name="theme-color" content="#120e0c" />
    <script>
      // Pose le thème avant le premier rendu (évite un flash du mauvais thème). Même règle que
      // src/theme/theme.ts : choix manuel mémorisé, sinon réglage de l'appareil.
      ;(function () {
        try {
          var saved = localStorage.getItem('bdbynico:theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'clair' || saved === 'rouille' ? saved : dark ? 'rouille' : 'clair'
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'clair' ? '#f4f4f2' : '#120e0c')
        } catch (e) {
          /* thème par défaut : sombre */
        }
      })()
    </script>
    <link rel="icon" href="/BDbyNico/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/BDbyNico/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/BDbyNico/apple-touch-icon-180x180.png" />
    <title>BDbyNico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
